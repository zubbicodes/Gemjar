services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gemjar
      POSTGRES_USER: gemjar
      POSTGRES_PASSWORD: gemjar
    ports:
      - "5432:5432"
    volumes:
      - gemjar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemjar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - gemjar_redis:/data

volumes:
  gemjar_postgres:
  gemjar_redis:
